services:
  comfyui-mcp:
    image: comfyui-mcp:latest
    pull_policy: never
    container_name: comfyui-mcp
    restart: "no"
    init: true
    # Rootless Docker maps container root to the daemon owner (host uid/gid 1000),
    # allowing the MCP state bind mount to remain owned by the host user.
    user: "0:0"
    command:
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "9100"
      # The published port is restricted to host loopback below. This opt-out is
      # therefore not reachable from the LAN or through Traefik.
      - --allow-unauthenticated-non-loopback
    environment:
      COMFYUI_URL: http://comfyui:8188
      COMFYUI_MCP_DATA_DIR: /data/mcp
      COMFYUI_DOWNLOAD_CACHE_DIR: /data/cache/downloads
      HOME: /data
      XDG_CACHE_HOME: /data/cache
      XDG_CONFIG_HOME: /data/config
    networks:
      - genai
      - proxy
    ports:
      - "127.0.0.1:${MCP_PORT}:9100"
    volumes:
      - ${MCP_DATA_DIR}:/data
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:9100/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  genai:
    external: true
  proxy:
    external: true
