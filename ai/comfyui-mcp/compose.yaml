services:
  comfyui-mcp:
    image: comfy-mcp:latest
    pull_policy: never
    container_name: comfyui-mcp
    restart: "no"
    init: true
    # Rootless container root maps to the host daemon owner.
    user: "0:0"
    environment:
      # Local proxy satisfies the official CLI's loopback-only discovery rule.
      COMFY_LOCAL_URL: http://127.0.0.1:8188
      COMFY_PROXY_TARGET: comfyui:8188
      HOME: /state/official
      XDG_CACHE_HOME: /state/official/cache
      XDG_CONFIG_HOME: /state/official/config
    networks:
      - genai
      # Non-internal network enables rootless Docker's loopback port publishing.
      - proxy
    ports:
      - "127.0.0.1:${MCP_PORT}:9100"
    volumes:
      - ${MCP_DATA_DIR}:/state
      - ${DATA_DIR}/models:/data/models
      - ${DATA_DIR}/input:/data/input
      - ${DATA_DIR}/user:/data/user
      - ${DATA_DIR}/custom_nodes:/data/custom_nodes:ro
      - ${OUTPUT_DIR}:/data/output
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=4).close(); r=urllib.request.Request('http://localhost:9100/mcp', data=b'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}', headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}); assert b'protocolVersion' in urllib.request.urlopen(r, timeout=4).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  genai:
    external: true
  proxy:
    external: true
