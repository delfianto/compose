services:
  comfy:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL}
        COMFYUI_REPOSITORY: ${COMFYUI_REPOSITORY}
        COMFYUI_REF: ${COMFYUI_REF}
        COMFYUI_GGUF_REPOSITORY: ${COMFYUI_GGUF_REPOSITORY}
        COMFYUI_GGUF_REF: ${COMFYUI_GGUF_REF}
        COMFYUI_MULTIGPU_REPOSITORY: ${COMFYUI_MULTIGPU_REPOSITORY}
        COMFYUI_MULTIGPU_REF: ${COMFYUI_MULTIGPU_REF}
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: comfy
    restart: "no"
    init: true
    # Rootless Docker maps container root to the daemon owner (host uid/gid 1000).
    # Using container uid 1000 here would instead map to an unprivileged subuid.
    user: "0:0"
    environment:
      COMFYUI_REPOSITORY: ${COMFYUI_REPOSITORY}
      COMFYUI_REF: ${COMFYUI_REF}
      COMFYUI_AUTO_UPDATE: ${COMFYUI_AUTO_UPDATE}
      COMFYUI_UPDATE_STRICT: ${COMFYUI_UPDATE_STRICT}
      COMFYUI_INSTALL_CUSTOM_NODE_REQUIREMENTS: ${COMFYUI_INSTALL_CUSTOM_NODE_REQUIREMENTS}
    networks:
      - genai
      - proxy
    volumes:
      - ${DATA_DIR}/models:/data/models
      - ${DATA_DIR}/input:/data/input
      - ${DATA_DIR}/user:/data/user
      - ${DATA_DIR}/custom_nodes:/data/custom_nodes
      - ${OUTPUT_DIR}:/data/output
      - ${DATA_DIR}/cache/huggingface:/var/cache/huggingface
      - ${DATA_DIR}/cache/torch:/var/cache/torch
      - ${DATA_DIR}/cache/uv:/var/cache/uv
    tmpfs:
      - /data/temp:size=8G,mode=1777
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    shm_size: "8gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8188/', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfy.entrypoints=websecure"
      - "traefik.http.routers.comfy.rule=Host(`comfyui.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.comfy.tls.certresolver=cloudflare"
      - "traefik.http.services.comfy.loadbalancer.server.port=8188"
      - "homepage.group=Artificial Intelligence"
      - "homepage.name=ComfyUI"
      - "homepage.icon=comfyui.svg"
      - "homepage.href=https://comfyui.${TRAEFIK_ACME_DOMAIN}"
      - "homepage.description=Node-based generative AI GUI"

  mcp:
    build:
      context: https://github.com/artokun/comfyui-mcp.git#v${MCP_VERSION}
    image: ${MCP_IMAGE_NAME}:${MCP_VERSION}
    container_name: comfy-mcp
    restart: "no"
    init: true
    # Rootless Docker maps container root to the daemon owner (host uid/gid 1000),
    # allowing the MCP state bind mount to remain owned by the host user.
    user: "0:0"
    command:
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "9100"
      # The published port is restricted to host loopback below. This opt-out is
      # therefore not reachable from the LAN or through Traefik.
      - --allow-unauthenticated-non-loopback
    environment:
      COMFYUI_URL: http://comfy:8188
      COMFYUI_MCP_DATA_DIR: /data/mcp
      COMFYUI_DOWNLOAD_CACHE_DIR: /data/cache/downloads
      HOME: /data
      XDG_CACHE_HOME: /data/cache
      XDG_CONFIG_HOME: /data/config
    depends_on:
      comfy:
        condition: service_healthy
    networks:
      - genai
      - proxy
    ports:
      - "127.0.0.1:${MCP_PORT}:9100"
    volumes:
      - ${MCP_DATA_DIR}:/data
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:9100/mcp').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  genai:
    external: true
  proxy:
    external: true
