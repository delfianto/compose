services:
  toolkit:
    image: ${AI_TOOLKIT_IMAGE}
    container_name: ai-toolkit
    restart: "no"
    init: true
    user: "0:0"
    entrypoint: ["/secret-env.sh"]
    command: ["sh", "/entrypoint.sh"]
    env_file:
      - toolkit.env
      - path: toolkit.env.local
        required: false
    secrets:
      - source: huggingface_api_key
        target: HF_TOKEN
      - source: aitoolkit_auth
        target: AI_TOOLKIT_AUTH
    environment:
      TOOLKIT_MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,ai-toolkit:*,ostris-mcp.${TRAEFIK_ACME_DOMAIN}"
    networks:
      - proxy
    ports:
      # Host-local agents only; keep these off LAN/public interfaces.
      - "127.0.0.1:8675:8675"
      - "127.0.0.1:8676:8676"
    volumes:
      - ${COMPOSE_BASE}/lib/secret-env.sh:/secret-env.sh:ro
      # Catalog configuration is host data; resolver and compatibility code ship in the image.
      - type: bind
        source: ${MODEL_CATALOG}
        target: /etc/ai-toolkit/models.json
        read_only: true
        bind:
          create_host_path: false
      - ${DATASETS_DIR}:/app/ai-toolkit/datasets
      # Direct shared paths for training checkpoints, VAE and text encoders.
      # Refuse a missing source instead of silently creating an empty model tree.
      - type: bind
        source: ${COMFY_MODELS_DIR}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      # Existing model assets remain available to catalog entries and saved jobs.
      - ${DATA_DIR}/models:/app/ai-toolkit/models:ro
      - ${DATA_DIR}/output:/app/ai-toolkit/output
      - ${DATA_DIR}/config:/app/ai-toolkit/config
      - ${DATA_DIR}/cache/huggingface:/root/.cache/huggingface
      # Persist the directory, including SQLite WAL/SHM, through an image symlink.
      - ${DATA_DIR}/database:/app/ai-toolkit/state
    devices:
      # Select per job in the UI: 4080 for training, 3060 for captioning.
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    shm_size: "8gb"
    healthcheck:
      # UI returns 401 until the auth token is sent; that still means it is up.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8676/health > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-toolkit.entrypoints=websecure"
      - "traefik.http.routers.ai-toolkit.rule=Host(`ostris.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.ai-toolkit.tls.certresolver=cloudflare"
      - "traefik.http.routers.ai-toolkit.service=ai-toolkit"
      - "traefik.http.services.ai-toolkit.loadbalancer.server.port=8675"
      - "traefik.http.routers.ai-toolkit-mcp.entrypoints=websecure"
      - "traefik.http.routers.ai-toolkit-mcp.rule=Host(`ostris-mcp.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.ai-toolkit-mcp.tls.certresolver=cloudflare"
      - "traefik.http.routers.ai-toolkit-mcp.service=ai-toolkit-mcp"
      - "traefik.http.services.ai-toolkit-mcp.loadbalancer.server.port=8676"
      - "homepage.group=Artificial Intelligence"
      - "homepage.name=AI Toolkit"
      - "homepage.icon=mdi-tune-vertical"
      - "homepage.href=https://ostris.${TRAEFIK_ACME_DOMAIN}"
      - "homepage.description=Ostris LoRA trainer (Krea 2, Qwen Image 2.1)"

networks:
  proxy:
    external: true

secrets:
  huggingface_api_key:
    file: ${SECRET_DIR}/huggingface_api_key
  aitoolkit_auth:
    file: ${SECRET_DIR}/aitoolkit_auth
