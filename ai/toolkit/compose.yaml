services:
  toolkit:
    image: local/aitoolkit-mcp:latest
    build: .
    container_name: toolkit
    restart: "no"
    init: true
    user: "0:0"
    entrypoint: ["/secret-env.sh"]
    command: ["sh", "/entrypoint.sh"]
    env_file:
      - toolkit.env
      - path: toolkit.env.local
        required: false
    secrets:
      - source: huggingface_api_key
        target: HF_TOKEN
      - source: aitoolkit_auth
        target: AI_TOOLKIT_AUTH
    environment:
      TOOLKIT_MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,toolkit:*,toolkit-mcp.${TRAEFIK_ACME_DOMAIN}"
    networks:
      - proxy
    volumes:
      - ${COMPOSE_BASE}/lib/secret-env.sh:/secret-env.sh:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./mcp_adapter:/opt/toolkit-mcp-src:ro
      # Ubuntu's /usr/lib sitecustomize wins; use a .pth import for our lazy patch.
      - ./sitecustomize.py:/usr/local/lib/python3.12/dist-packages/toolkit_local_models.py:ro
      - ./toolkit-local-models.pth:/usr/local/lib/python3.12/dist-packages/toolkit-local-models.pth:ro
      - ${DATASETS_DIR}:/app/ai-toolkit/datasets
      - ${COMFY_MODELS_DIR}:/models:ro
      - ${DATA_DIR}/models:/app/ai-toolkit/models:ro
      - ${DATA_DIR}/output:/app/ai-toolkit/output
      - ${DATA_DIR}/config:/app/ai-toolkit/config
      - ${DATA_DIR}/cache/huggingface:/root/.cache/huggingface
      # Persist the directory, including SQLite WAL/SHM, through an image symlink.
      - ${DATA_DIR}/database:/app/ai-toolkit/state
    devices:
      # Select per job in the UI: 4080 for training, 3060 for captioning.
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    shm_size: "8gb"
    healthcheck:
      # UI returns 401 until the auth token is sent; that still means it is up.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8676/health > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.toolkit.entrypoints=websecure"
      - "traefik.http.routers.toolkit.rule=Host(`toolkit.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.toolkit.tls.certresolver=cloudflare"
      - "traefik.http.routers.toolkit.service=toolkit"
      - "traefik.http.services.toolkit.loadbalancer.server.port=8675"
      - "traefik.http.routers.toolkit-mcp.entrypoints=websecure"
      - "traefik.http.routers.toolkit-mcp.rule=Host(`toolkit-mcp.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.toolkit-mcp.tls.certresolver=cloudflare"
      - "traefik.http.routers.toolkit-mcp.service=toolkit-mcp"
      - "traefik.http.services.toolkit-mcp.loadbalancer.server.port=8676"
      - "homepage.group=Artificial Intelligence"
      - "homepage.name=AI Toolkit"
      - "homepage.icon=mdi-tune-vertical"
      - "homepage.href=https://toolkit.${TRAEFIK_ACME_DOMAIN}"
      - "homepage.description=Ostris LoRA trainer (Krea 2, Qwen Image 2.1)"

networks:
  proxy:
    external: true

secrets:
  huggingface_api_key:
    file: ${SECRET_DIR}/huggingface_api_key
  aitoolkit_auth:
    file: ${SECRET_DIR}/aitoolkit_auth
