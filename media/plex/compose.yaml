services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: "no"
    env_file:
      - plex.env
    # Rootless Docker >=29.5 exposes the real host network in this mode.
    # Plex must see the LAN interface to advertise local connections correctly.
    network_mode: host
    volumes:
      - ${FILE_DIR}:/media
      - ${DATA_DIR}/plex/config:/config
      - ${DATA_DIR}/plex/transcode:/transcode
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.rule=Host(`plex.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.plex.tls.certresolver=cloudflare"
      - "traefik.http.services.plex.loadbalancer.server.url=http://${LAN_IP}:32400"
      - "homepage.group=Media"
      - "homepage.name=Plex"
      - "homepage.icon=plex.svg"
      - "homepage.href=https://plex.${TRAEFIK_ACME_DOMAIN}"
      - "homepage.description=Media Server"
      - "homepage.widget.type=plex"
      - "homepage.widget.url=http://${LAN_IP}:32400"
      - "homepage.widget.key={{HOMEPAGE_FILE_PLEX_KEY}}"
      - 'homepage.widget.fields=["streams","movies","tv"]'
    devices:
      - nvidia.com/gpu=${GPU_ID}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:32400/identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2GB

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    restart: "no"
    container_name: tautulli
    env_file:
      - plex.env
    depends_on:
      - plex
    networks:
      - proxy
    # Preserve the configured Plex hostname after Plex leaves the proxy bridge.
    extra_hosts:
      - "plex:${LAN_IP}"
    volumes:
      - ${DATA_DIR}/tautulli:/config
    labels:
      # Traefik integration
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.tautulli.tls.certresolver=cloudflare"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
      # Homepage integration
      - "homepage.group=Media"
      - "homepage.name=Tautulli"
      - "homepage.icon=tautulli.svg"
      - "homepage.href=https://tautulli.${TRAEFIK_ACME_DOMAIN}"
      - "homepage.description=Plex Monitoring"
      - "homepage.widget.type=tautulli"
      - "homepage.widget.url=http://tautulli:8181"
      - "homepage.widget.key={{HOMEPAGE_FILE_TAUTULLI_KEY}}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512MB

networks:
  proxy:
    external: true
