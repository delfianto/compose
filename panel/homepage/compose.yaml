services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1
    container_name: homepage
    restart: "no"
    env_file:
      # Local-only values (e.g. weather location), not committed
      - path: homepage.env.local
        required: false
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${TRAEFIK_ACME_DOMAIN}
      # Widget API keys, referenced from other services' labels as {{HOMEPAGE_FILE_*}}
      - HOMEPAGE_FILE_FORGEJO_KEY=/run/secrets/forgejo_api_key
      - HOMEPAGE_FILE_PLEX_KEY=/run/secrets/plex_api_key
      - HOMEPAGE_FILE_STASH_KEY=/run/secrets/stash_api_key
      - HOMEPAGE_FILE_TAUTULLI_KEY=/run/secrets/tautulli_api_key
    secrets:
      - forgejo_api_key
      - plex_api_key
      - stash_api_key
      - tautulli_api_key
    networks:
      - proxy
      - metrics
    volumes:
      - ${DATA_DIR}/homepage:/app/config
      - ${DATA_DIR}/homepage/icons:/app/public/icons
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.rule=Host(`home.${TRAEFIK_ACME_DOMAIN}`)"
      - "traefik.http.routers.homepage.tls.certresolver=cloudflare"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512MB

networks:
  proxy:
    external: true
  metrics:
    external: true

secrets:
  forgejo_api_key:
    file: ${SECRET_DIR}/forgejo_api_key
  plex_api_key:
    file: ${SECRET_DIR}/plex_api_key
  stash_api_key:
    file: ${SECRET_DIR}/stash_api_key
  tautulli_api_key:
    file: ${SECRET_DIR}/tautulli_api_key
